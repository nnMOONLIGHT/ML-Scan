services:
  - type: pserv
    name: trayeye-db
    plan: basic-256mb
    databaseName: trayeye
    user: trayeye
  - type: web
    name: trayeye-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Europe/Berlin
      - key: DATABASE_URL
        fromDatabase:
          name: trayeye-db
          property: connectionString
      - key: TRAYEYE_ADMIN_TOKEN
        sync: false
  - type: web
    name: trayeye-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRAYEYE_API_URL
        value: https://trayeye-api.onrender.com
      - key: TRAYEYE_ADMIN_TOKEN
        sync: false
